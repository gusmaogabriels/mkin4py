name: Tests and distributions
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        dependencies: [latest]
        include:
          - os: macos-latest
            python: '3.12'
            dependencies: latest
          - os: windows-latest
            python: '3.12'
            dependencies: latest
          - os: ubuntu-latest
            python: '3.11'
            dependencies: minimum
    runs-on: ${{ matrix.os }}
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install "jax[cpu]==0.4.38" ".[dev]"
      - if: matrix.dependencies != 'minimum'
        run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: mkin4py methods --json
      - run: python -m benchmarks.timing --repeats 5 --output build/timing.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.dependencies }}
          path: build/timing.json
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and run outside source tree
        run: |
          python -m venv /tmp/mkin4py-wheel
          /tmp/mkin4py-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/mkin4py-wheel/bin/python -m pip check
          /tmp/mkin4py-wheel/bin/mkin4py example --json > /tmp/mkin4py-example.json
          /tmp/mkin4py-wheel/bin/mkin4py solve /tmp/mkin4py-example.json --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
